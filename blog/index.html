<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Insights on digital marketing &amp; web development | Inpixel Network</title>
  <meta name="description" content="Insights on digital marketing, web development &amp; growing your business online. Read the latest articles from Inpixel Network.">
  <link rel="canonical" href="https://inpixelnetwork.in/blog/">
  <!-- Open Graph -->
  <meta property="og:title" content="Blog - Insights on digital marketing &amp; web development | Inpixel Network">
  <meta property="og:description" content="Insights on digital marketing, web development &amp; growing your business online.">
  <meta property="og:url" content="https://inpixelnetwork.in/blog/">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/png" href="../logo1.jpeg">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../main.js" defer></script>
</head>
<body>
  <div class="blog-grid" id="blogGrid"></div>
  <div id="loadMoreContainer" style="display:none;">
    <button class="btn-primary" id="loadMoreBtn" onclick="loadBlogs()">Load More</button>
  </div>

  <script>
    // Supabase Config
    const supabaseUrl = 'https://xcsdnrkgqkacmqdmedju.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhjc2RucmtncWthY21xZG1lZGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzI2NzYsImV4cCI6MjA5NjE0ODY3Nn0.8X_Jr8JQmO3lojcxoG-hhz6FEPCOiqf3EQ4QR5vNRFI';
    const db = (window.supabase && window.supabase.createClient)
      ? window.supabase.createClient(supabaseUrl, supabaseKey)
      : null;

    const LIMIT = 12;
    let offset = 0;

    // Escaping function for XSS protection
    function esc(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g,
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag)
      );
    }

    function formatDate(dateString) {
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('en-US', options);
    }

    async function loadBlogs() {
      const grid = document.getElementById('blogGrid');
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      const loadMoreContainer = document.getElementById('loadMoreContainer');

      try {
        if(offset === 0) grid.innerHTML = ''; // clear skeletons

        loadMoreBtn.innerText = 'Loading...';
        loadMoreBtn.disabled = true;

        if (!db) {
          throw new Error('Supabase library failed to load.');
        }

        const { data, error } = await db
          .from('blogs')
          .select('*')
          .eq('status', 'published')
          .order('created_at', { ascending: false })
          .range(offset, offset + LIMIT - 1);

        if (error) throw error;

        if (data.length === 0 && offset === 0) {
          grid.innerHTML = '<div class="empty-state">No blog posts yet. Check back soon!</div>';
          loadMoreContainer.style.display = 'none';
          return;
        }

        let html = '';
        data.forEach(blog => {
          const formatted_date = formatDate(blog.created_at);
          // Estimate reading time (roughly 200 words per minute)
          const wordCount = blog.content ? blog.content.replace(/<[^>]*>?/gm, '').split(/\s+/).length : 0;
          const reading_time = Math.max(1, Math.ceil(wordCount / 200));

          let excerpt = blog.excerpt || '';
          if(!excerpt && blog.content) {
            excerpt = blog.content.replace(/<[^>]*>?/gm, '').substring(0, 120) + '...';
          } else if(excerpt.length > 120) {
            excerpt = excerpt.substring(0, 120) + '...';
          }

          const thumbUrl = blog.thumbnail_url || 'https://via.placeholder.com/800x450/101018/f0a500?text=Inpixel+Blog';

          html += `
            <a href="/blog/${esc(blog.slug)}" class="blog-card">
              <div class="blog-card-img"><img src="${esc(thumbUrl)}" alt="${esc(blog.title)}" loading="lazy"></div>
              <div class="blog-card-body">
                <span class="blog-card-cat">${esc(blog.category || 'Uncategorized')}</span>
                <h3 class="blog-card-title">${esc(blog.title)}</h3>
                <p class="blog-card-excerpt">${esc(excerpt)}</p>
                <div class="blog-card-meta">
                  <span>${esc(formatted_date)} · ${reading_time} min read</span>
                  <span class="read-more">Read More &rarr;</span>
                </div>
              </div>
            </a>
          `;
        });

        grid.innerHTML += html;
        offset += data.length;

        if (data.length < LIMIT) {
          loadMoreContainer.style.display = 'none';
        } else {
          loadMoreContainer.style.display = 'block';
          loadMoreBtn.innerText = 'Load More';
          loadMoreBtn.disabled = false;
        }

      } catch (err) {
        console.error('Error fetching blogs:', err);
        if(offset === 0) {
          grid.innerHTML = '<div class="empty-state">Failed to load blogs. Please try again later.</div>';
        }
      }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', loadBlogs);
  </script>

</body>
</html>
