<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Ledger — Inpixel Network</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin
  onerror="var s=document.createElement('script');s.src='https://unpkg.com/react@18/umd/react.production.min.js';document.write(s.outerHTML);"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin
  onerror="var s=document.createElement('script');s.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';document.write(s.outerHTML);"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js" crossorigin
  onerror="var s=document.createElement('script');s.src='https://unpkg.com/@babel/standalone/babel.min.js';document.write(s.outerHTML);"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700&display=swap');
  :root{
    --bg:#0b0a08; --panel:#151209; --panel-soft:#100e0a; --border:#2b2317; --border-soft:#1e1912;
    --gold:#c9a24b; --gold-bright:#e8c56a; --gold-dim:#7d6636;
    --text:#f2ece0; --text-muted:#a89d85; --text-faint:#6b6353;
    --danger:#c2594a; --success:#82a373;
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;margin:0;}
  body{
    font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,75,0.08), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 0%, rgba(201,162,75,0.05), transparent 60%);
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .fadein{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .spin{display:inline-block;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  tr.row:hover{background:rgba(201,162,75,0.05);}
  table{border-collapse:collapse;width:100%;font-size:13.5px;}
  th{padding:12px 16px;color:var(--text-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;border-bottom:1px solid var(--border);}
  td{padding:12px 16px;color:var(--text);white-space:nowrap;border-bottom:1px solid var(--border-soft);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;}
  .eyebrow{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);}
  .btn{font-family:'DM Sans',sans-serif;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:7px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:filter .15s;}
  .btn:hover{filter:brightness(1.1);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--gold);color:#1a1508;}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
  .btn-subtle{background:var(--panel-soft);color:var(--text-muted);border-color:var(--border);}
  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px;}
  .field span{font-size:12px;color:var(--text-muted);font-weight:500;}
  .field input{background:var(--panel-soft);border:1px solid var(--border);border-radius:7px;padding:10px 12px;color:var(--text);font-size:13.5px;font-family:'DM Sans',sans-serif;}
  .tab-btn{background:transparent;border:none;cursor:pointer;padding:10px 4px;margin-right:26px;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
</style>
</head>

<script type="text/babel" data-presets="react">

const money = n => `₹${Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2, maximumFractionDigits:2})}`;
const num = n => Number(n||0).toLocaleString("en-IN");

function Seal({size=44}){
  return (
    <div style={{width:size,height:size,borderRadius:"50%",border:"1.5px solid var(--gold)",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",flexShrink:0,background:"radial-gradient(circle at 35% 30%, rgba(201,162,75,0.18), transparent 70%)"}}>
      <div style={{position:"absolute",inset:3,borderRadius:"50%",border:"1px solid var(--gold-dim)"}}/>
      <span style={{fontFamily:"'Playfair Display',serif",fontWeight:900,fontSize:size*0.38,color:"var(--gold-bright)",letterSpacing:"-0.02em"}}>IN</span>
    </div>
  );
}

function StatCard({label,value,sub}){
  return (
    <div className="card" style={{display:"flex",flexDirection:"column",gap:10}}>
      <span style={{fontFamily:"'Syne',sans-serif",fontSize:10.5,fontWeight:700,letterSpacing:".12em",textTransform:"uppercase",color:"var(--text-muted)"}}>{label}</span>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:30,fontWeight:700,lineHeight:1}}>{value}</div>
      {sub && <div style={{fontSize:12.5,color:"var(--text-faint)"}}>{sub}</div>}
    </div>
  );
}

function Field({label,value,onChange,placeholder,type="text"}){
  return (
    <label className="field">
      <span>{label}</span>
      <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}/>
    </label>
  );
}

function EmptyState({text}){
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"50px 20px",color:"var(--text-faint)",textAlign:"center"}}>{text}</div>;
}

function BarCanvas({labels, data, height=200}){
  const ref = useRef(); const chart = useRef(); const [failed,setFailed] = useState(false); const [retry,setRetry] = useState(0);
  useEffect(()=>{ const h=()=>setRetry(r=>r+1); window.addEventListener("chartjsready",h); return ()=>window.removeEventListener("chartjsready",h); },[]);
  useEffect(()=>{
    try{
      if(typeof Chart === "undefined"){ setFailed(true); return; }
      setFailed(false);
      if(chart.current) chart.current.destroy();
      chart.current = new Chart(ref.current, {
        type:"bar",
        data:{labels, datasets:[{data, backgroundColor:"#c9a24b", borderRadius:4, maxBarThickness:28}]},
        options:{
          responsive:true, maintainAspectRatio:false,
          indexAxis:"y", plugins:{
            legend:{display:false},
            tooltip:{backgroundColor:"#100e0a", borderColor:"#2b2317", borderWidth:1, titleColor:"#f2ece0", bodyColor:"#f2ece0", padding:10, callbacks:{label:(ctx)=>` Spend: ₹${ctx.parsed.x.toFixed(2)}`}}
          },
          scales:{x:{ticks:{color:"#a89d85", callback:v=>"₹"+v},grid:{color:"#1e1912"}},y:{ticks:{color:"#a89d85"},grid:{display:false}}}
        }
      });
    }catch(e){ console.error("Chart render failed:", e); setFailed(true); }
    return ()=>{ try{ chart.current && chart.current.destroy(); }catch(e){} };
  },[JSON.stringify(labels), JSON.stringify(data), retry]);
  if(failed) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-faint)",fontSize:12.5}}>Chart couldn't load — data is still below in the table.</div>;
  return <div style={{height}}><canvas ref={ref}/></div>;
}

function TrendCanvas({labels, spend, leads, height=260}){
  const ref = useRef(); const chart = useRef(); const [failed,setFailed] = useState(false); const [retry,setRetry] = useState(0);
  useEffect(()=>{ const h=()=>setRetry(r=>r+1); window.addEventListener("chartjsready",h); return ()=>window.removeEventListener("chartjsready",h); },[]);
  useEffect(()=>{
    try{
      if(typeof Chart === "undefined"){ setFailed(true); return; }
      setFailed(false);
      if(chart.current) chart.current.destroy();
      chart.current = new Chart(ref.current, {
        data:{
          labels,
          datasets:[
            {type:"bar", label:"Spend (₹)", data:spend, backgroundColor:"rgba(201,162,75,0.55)", borderColor:"#c9a24b", borderWidth:1, borderRadius:4, yAxisID:"y", order:2, maxBarThickness:36},
            {type:"line", label:"Leads", data:leads, borderColor:"#8fbf82", backgroundColor:"#8fbf82", borderWidth:2.5, pointRadius:4, pointHoverRadius:6, pointBackgroundColor:"#8fbf82", tension:.3, yAxisID:"y1", order:1}
          ]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          interaction:{mode:"index", intersect:false},
          plugins:{
            legend:{position:"top", align:"end", labels:{color:"#a89d85", boxWidth:12, usePointStyle:true, font:{size:11.5}}},
            tooltip:{
              backgroundColor:"#100e0a", borderColor:"#2b2317", borderWidth:1, titleColor:"#f2ece0", bodyColor:"#f2ece0", padding:10,
              callbacks:{ label:(ctx)=> ctx.dataset.label==="Spend (₹)" ? ` Spend: ₹${ctx.parsed.y.toFixed(2)}` : ` Leads: ${ctx.parsed.y}` }
            }
          },
          scales:{
            x:{ ticks:{color:"#a89d85", font:{size:11}}, grid:{display:false} },
            y:{ position:"left", ticks:{color:"#c9a24b", font:{size:11}, callback:v=>"₹"+v}, grid:{color:"#1e1912"}, title:{display:true, text:"Spend", color:"#c9a24b", font:{size:11}} },
            y1:{ position:"right", ticks:{color:"#8fbf82", font:{size:11}, precision:0}, grid:{display:false}, title:{display:true, text:"Leads", color:"#8fbf82", font:{size:11}}, beginAtZero:true }
          }
        }
      });
    }catch(e){ console.error("Chart render failed:", e); setFailed(true); }
    return ()=>{ try{ chart.current && chart.current.destroy(); }catch(e){} };
  },[JSON.stringify(labels), JSON.stringify(spend), JSON.stringify(leads), retry]);
  if(failed) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-faint)",fontSize:12.5}}>Chart couldn't load — data is still below in the table.</div>;
  return <div style={{height}}><canvas ref={ref}/></div>;
}

function PieCanvas({labels, data, height=180}){
  const ref = useRef(); const chart = useRef(); const [failed,setFailed] = useState(false); const [retry,setRetry] = useState(0);
  const colors = ["#c9a24b","#e8c56a","#7d6636","#9c8a5e","#5f5238","#4a4028"];
  useEffect(()=>{ const h=()=>setRetry(r=>r+1); window.addEventListener("chartjsready",h); return ()=>window.removeEventListener("chartjsready",h); },[]);
  useEffect(()=>{
    try{
      if(typeof Chart === "undefined"){ setFailed(true); return; }
      setFailed(false);
      if(chart.current) chart.current.destroy();
      chart.current = new Chart(ref.current, {
        type:"doughnut",
        data:{labels, datasets:[{data, backgroundColor:colors}]},
        options:{plugins:{legend:{position:"right",labels:{color:"#a89d85",boxWidth:12}}}}
      });
    }catch(e){ console.error("Chart render failed:", e); setFailed(true); }
    return ()=>{ try{ chart.current && chart.current.destroy(); }catch(e){} };
  },[JSON.stringify(labels), retry]);
  if(failed) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-faint)",fontSize:12.5}}>Chart couldn't load — data is still below.</div>;
  return <div style={{height}}><canvas ref={ref}/></div>;
}

function App(){
  const [activeTab,setActiveTab] = useState("ads");
  const [showSettings,setShowSettings] = useState(false);

  const [pageId,setPageId] = useState(PAGE_ID);
  const [metaToken,setMetaToken] = useState(META_TOKEN);
  const [adAccountId,setAdAccountId] = useState(AD_ACCOUNT_ID);

  const [leads,setLeads] = useState([]);
  const [leadsLoading,setLeadsLoading] = useState(false);
  const [leadsError,setLeadsError] = useState(null);
  const [search,setSearch] = useState("");
  const [statusFilter,setStatusFilter] = useState("all");

  const [campaigns,setCampaigns] = useState([]);
  const [trend,setTrend] = useState([]);
  const [adsLoading,setAdsLoading] = useState(false);
  const [adsError,setAdsError] = useState(null);
  const [datePreset,setDatePreset] = useState(30);

  const fetchLeads = useCallback(async (token,pgId)=>{
    setLeadsLoading(true); setLeadsError(null);
    try{
      // Step 1: exchange the System User token for a Page access token
      const pageRes = await fetch(`https://graph.facebook.com/v19.0/${pgId}?fields=access_token,name&access_token=${token}`);
      const pageJson = await pageRes.json();
      if(pageJson.error) throw new Error(pageJson.error.message);
      const pageToken = pageJson.access_token;
      if(!pageToken) throw new Error("Could not get a Page access token — check the System User has Page access with the leads_retrieval permission.");

      // Step 2: list the Page's lead forms
      const formsRes = await fetch(`https://graph.facebook.com/v19.0/${pgId}/leadgen_forms?fields=name,status,leads_count&limit=100&access_token=${pageToken}`);
      const formsJson = await formsRes.json();
      if(formsJson.error) throw new Error(formsJson.error.message);
      const forms = formsJson.data || [];

      // Step 3: pull leads for every form
      const allLeads = [];
      for(const form of forms){
        const leadsRes = await fetch(`https://graph.facebook.com/v19.0/${form.id}/leads?fields=created_time,field_data&limit=200&access_token=${pageToken}`);
        const leadsJson = await leadsRes.json();
        if(leadsJson.error) continue; // skip a form we can't read rather than fail everything
        (leadsJson.data || []).forEach(l=>{
          const row = {form: form.name, created_time: l.created_time};
          (l.field_data || []).forEach(f=>{ row[f.name] = (f.values || []).join(", "); });
          allLeads.push(row);
        });
      }
      allLeads.sort((a,b)=> new Date(b.created_time) - new Date(a.created_time));
      setLeads(allLeads);
    }catch(e){ setLeadsError(e.message || "Could not reach the Meta Leads API."); }
    finally{ setLeadsLoading(false); }
  },[]);

  const fetchAds = useCallback(async (token,accountId,days)=>{
    setAdsLoading(true); setAdsError(null);
    try{
      const acc = accountId.replace(/^act_/,"");
      const until = new Date();
      const since = new Date(); since.setDate(until.getDate() - (days-1));
      const fmt = d => d.toISOString().slice(0,10);
      const range = encodeURIComponent(JSON.stringify({since: fmt(since), until: fmt(until)}));
      const fields = "campaign_name,spend,impressions,reach,frequency,clicks,ctr,cpc,cpm,inline_link_clicks,inline_link_click_ctr,cost_per_inline_link_click,actions";
      const campUrl = `https://graph.facebook.com/v19.0/act_${acc}/insights?level=campaign&fields=${fields}&time_range=${range}&limit=200&access_token=${token}`;
      const trendUrl = `https://graph.facebook.com/v19.0/act_${acc}/insights?fields=spend,actions&time_range=${range}&time_increment=1&access_token=${token}`;
      const [campRes, trendRes] = await Promise.all([fetch(campUrl), fetch(trendUrl)]);
      const campJson = await campRes.json();
      const trendJson = await trendRes.json();
      if(campJson.error) throw new Error(campJson.error.message);
      if(trendJson.error) throw new Error(trendJson.error.message);

      const leadCount = actions => {
        if(!actions) return 0;
        // Meta reports lead conversions under different canonical action_type labels
        // depending on the lead source (native Lead Ads form, pixel-based, etc).
        // Only match ONE of these exactly — never sum multiple, that double-counts the same lead.
        const priority = [
          "leadgen.other",
          "onsite_conversion.lead_grouped",
          "lead",
          "offsite_conversion.fb_pixel_lead",
          "onsite_conversion.lead_grouped_action",
        ];
        for(const type of priority){
          const match = actions.find(a => a.action_type === type);
          if(match) return Number(match.value || 0);
        }
        return 0;
      };

      const camps = (campJson.data||[]).map(c=>{
        const results = leadCount(c.actions);
        const spend = Number(c.spend||0);
        return {
          name:c.campaign_name, spend,
          impressions:Number(c.impressions||0),
          reach:Number(c.reach||0),
          frequency:Number(c.frequency||0),
          cpm:Number(c.cpm||0),
          clicks:Number(c.clicks||0), ctrAll:Number(c.ctr||0), cpcAll:Number(c.cpc||0),
          linkClicks:Number(c.inline_link_clicks||0), ctrLink:Number(c.inline_link_click_ctr||0), cpcLink:Number(c.cost_per_inline_link_click||0),
          results, cpl: results>0 ? spend/results : null,
        };
      }).sort((a,b)=>b.spend-a.spend);

      const trendRows = (trendJson.data||[]).map(d=>({date:(d.date_start||"").slice(5), spend:Number(d.spend||0), leads:leadCount(d.actions)}));

      setCampaigns(camps); setTrend(trendRows);
    }catch(e){ setAdsError(e.message || "Could not reach the Meta Ads API."); }
    finally{ setAdsLoading(false); }
  },[]);

  useEffect(()=>{
    fetchLeads(metaToken,pageId);
    fetchAds(metaToken,adAccountId,datePreset);
  },[]);

  useEffect(()=>{ fetchAds(metaToken,adAccountId,datePreset); },[datePreset]);

  const connectLeads = ()=> fetchLeads(metaToken,pageId);

  const csvInputRef = useRef();
  const handleCsvUpload = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    setLeadsError(null);
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const text = ev.target.result;
        const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
        if(parsed.errors && parsed.errors.length){
          console.warn("CSV parse warnings:", parsed.errors);
        }
        setLeads(parsed.data);
      }catch(err){
        setLeadsError("Couldn't read that CSV — make sure it's the export from Meta's Leads Center.");
      }
    };
    reader.readAsText(file);
    e.target.value = ""; // allow re-uploading the same filename later
  };
  const connectAds = ()=> fetchAds(metaToken,adAccountId,datePreset);

  const filteredLeads = useMemo(()=> leads.filter(l=>{
    const hay = JSON.stringify(l).toLowerCase();
    const matchesSearch = !search || hay.includes(search.toLowerCase());
    const status = (l.status || l.lead_status || "new").toLowerCase();
    const matchesStatus = statusFilter==="all" || status===statusFilter;
    return matchesSearch && matchesStatus;
  }),[leads,search,statusFilter]);

  const statuses = useMemo(()=>{
    const s = new Set(leads.map(l=>(l.status||l.lead_status||"new").toLowerCase()));
    return ["all",...Array.from(s)];
  },[leads]);

  const leadsLast7d = useMemo(()=>{
    const cutoff = Date.now() - 7*24*3600*1000;
    return leads.filter(l=>{ const d=l.created_time||l.created_at; return d && new Date(d).getTime()>=cutoff; }).length;
  },[leads]);

  const sourceBreakdown = useMemo(()=>{
    const m={}; leads.forEach(l=>{ const src=l.form||l["form_name"]||l["Form name"]||l["form name"]||"Unknown form"; m[src]=(m[src]||0)+1; });
    return Object.entries(m).map(([name,value])=>({name,value}));
  },[leads]);

  const adsTotals = useMemo(()=>{
    const spend = campaigns.reduce((s,c)=>s+c.spend,0);
    const results = campaigns.reduce((s,c)=>s+c.results,0);
    const clicks = campaigns.reduce((s,c)=>s+c.clicks,0);
    const linkClicks = campaigns.reduce((s,c)=>s+c.linkClicks,0);
    const impressions = campaigns.reduce((s,c)=>s+c.impressions,0);
    const ctrAll = impressions>0 ? (clicks/impressions)*100 : 0;
    const ctrLink = impressions>0 ? (linkClicks/impressions)*100 : 0;
    const cpl = results>0 ? spend/results : null;
    return {spend,results,ctrAll,ctrLink,cpl};
  },[campaigns]);

  return (
    <div style={{padding:"28px 28px 60px",maxWidth:1200,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:28,flexWrap:"wrap",gap:16}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <Seal/>
          <div>
            <div className="eyebrow">Inpixel Network · Command Deck</div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:26,fontWeight:700,marginTop:2}}>The Ledger</div>
          </div>
        </div>
        <button className="btn btn-ghost" onClick={()=>setShowSettings(s=>!s)}>⚙ Connections</button>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:22,borderBottom:"1px solid var(--border)"}}>
        <button className={"tab-btn"+(activeTab==="ads"?" active":"")} onClick={()=>setActiveTab("ads")}>Meta Ads Performance</button>
        <button className={"tab-btn"+(activeTab==="leads"?" active":"")} onClick={()=>setActiveTab("leads")}>Leads</button>
      </div>

      {showSettings && (
        <div className="card fadein" style={{marginBottom:26}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div className="eyebrow">Data Connections</div>
            <button onClick={()=>setShowSettings(false)} style={{background:"none",border:"none",color:"var(--text-muted)",cursor:"pointer",fontSize:16}}>✕</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:28}}>
            <div>
              <div style={{fontWeight:700,fontSize:13.5,marginBottom:10}}>Meta Lead Ads — Leads</div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <Field label="Facebook Page ID" value={pageId} onChange={setPageId}/>
                <div style={{fontSize:11.5,color:"var(--text-faint)"}}>Uses the same access token as Ads (needs leads_retrieval + pages_show_list permissions)</div>
                <button className="btn btn-primary" style={{width:"fit-content"}} onClick={connectLeads}>↻ Reconnect</button>
                {leadsError && <div style={{fontSize:12,color:"var(--danger)"}}>⚠ {leadsError}</div>}
              </div>
            </div>
            <div>
              <div style={{fontWeight:700,fontSize:13.5,marginBottom:10}}>Meta Marketing API — Ads</div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <Field label="Access token" value={metaToken} onChange={setMetaToken} type="password"/>
                <Field label="Ad account ID" value={adAccountId} onChange={setAdAccountId}/>
                <button className="btn btn-primary" style={{width:"fit-content"}} onClick={connectAds}>↻ Reconnect</button>
                {adsError && <div style={{fontSize:12,color:"var(--danger)"}}>⚠ {adsError}</div>}
              </div>
            </div>
          </div>
        </div>
      )}

      {activeTab==="leads" && (
        <div className="fadein">
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:14,marginBottom:20}}>
            <StatCard label="Total Leads" value={num(leads.length)}/>
            <StatCard label="Last 7 Days" value={num(leadsLast7d)}/>
            <StatCard label="Sources" value={num(sourceBreakdown.length)} sub="Lead forms"/>
          </div>

          {sourceBreakdown.length>1 && (
            <div className="card" style={{marginBottom:20}}>
              <div className="eyebrow">Leads by Source</div>
              <PieCanvas labels={sourceBreakdown.map(s=>s.name)} data={sourceBreakdown.map(s=>s.value)}/>
            </div>
          )}

          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <input placeholder="Search leads..." value={search} onChange={e=>setSearch(e.target.value)}
              style={{flex:1,minWidth:220,background:"var(--panel-soft)",border:"1px solid var(--border)",borderRadius:7,padding:"10px 12px",color:"var(--text)",fontSize:13.5}}/>
            <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}
              style={{background:"var(--panel-soft)",border:"1px solid var(--border)",borderRadius:7,padding:"10px 12px",color:"var(--text)",fontSize:13}}>
              {statuses.map(s=><option key={s} value={s}>{s==="all"?"All statuses":s}</option>)}
            </select>
            <button className="btn btn-subtle" onClick={()=>fetchLeads(metaToken,pageId)}>
              <span className={leadsLoading?"spin":""}>↻</span> Refresh (API)
            </button>
            <input type="file" accept=".csv" ref={csvInputRef} onChange={handleCsvUpload} style={{display:"none"}}/>
            <button className="btn btn-primary" onClick={()=>csvInputRef.current.click()}>
              ⬆ Upload CSV
            </button>
          </div>
          <div style={{fontSize:11.5,color:"var(--text-faint)",marginTop:-6,marginBottom:14}}>
            "Refresh (API)" needs the leads_retrieval permission (blocked pending Business Verification).
            Until then, export from Meta Business Suite → Leads Center → Download, and upload that CSV here.
          </div>

          <div className="card" style={{padding:0,overflow:"hidden"}}>
            {leadsLoading ? <div style={{padding:40,textAlign:"center",color:"var(--text-faint)"}}>Loading leads…</div>
            : leadsError ? <div style={{padding:40}}><EmptyState text={`⚠ ${leadsError}`}/></div>
            : filteredLeads.length===0 ? <div style={{padding:40}}><EmptyState text="No leads match — try clearing filters."/></div>
            : (
              <div style={{overflowX:"auto"}}>
                <table>
                  <thead><tr>{Object.keys(filteredLeads[0]).slice(0,6).map(k=><th key={k}>{k}</th>)}</tr></thead>
                  <tbody>
                    {filteredLeads.map((l,i)=>(
                      <tr className="row" key={i}>
                        {Object.keys(filteredLeads[0]).slice(0,6).map(k=>(
                          <td key={k} style={{maxWidth:220,overflow:"hidden",textOverflow:"ellipsis"}}>{String(l[k]??"—")}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}

      {activeTab==="ads" && (
        <div className="fadein">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
            <div className="eyebrow">Performance window</div>
            <div style={{display:"flex",gap:8}}>
              <select value={datePreset} onChange={e=>setDatePreset(Number(e.target.value))}
                style={{background:"var(--panel-soft)",border:"1px solid var(--border)",borderRadius:7,padding:"9px 12px",color:"var(--text)",fontSize:13}}>
                <option value={1}>Today</option>
                <option value={7}>Last 7 days</option>
                <option value={14}>Last 14 days</option>
                <option value={30}>Last 30 days</option>
                <option value={90}>Last 90 days</option>
              </select>
              <button className="btn btn-subtle" onClick={()=>fetchAds(metaToken,adAccountId,datePreset)}>
                <span className={adsLoading?"spin":""}>↻</span> Refresh
              </button>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:14,marginBottom:20}}>
            <StatCard label="Total Spend" value={money(adsTotals.spend)}/>
            <StatCard label="Leads / Results" value={num(adsTotals.results)}/>
            <StatCard label="CTR (Link)" value={`${adsTotals.ctrLink.toFixed(2)}%`}/>
            <StatCard label="CTR (All)" value={`${adsTotals.ctrAll.toFixed(2)}%`}/>
            <StatCard label="Cost / Lead" value={adsTotals.cpl ? money(adsTotals.cpl) : "—"}/>
          </div>

          {adsError && <div className="card" style={{marginBottom:20,color:"var(--danger)",fontSize:13}}>⚠ {adsError}</div>}

          <div className="card" style={{padding:0,overflow:"hidden",marginBottom:20}}>
            {adsLoading ? <div style={{padding:40,textAlign:"center",color:"var(--text-faint)"}}>Loading campaigns…</div>
            : campaigns.length===0 && !adsError ? <div style={{padding:40}}><EmptyState text="No campaign data for this window."/></div>
            : campaigns.length>0 && (
              <div style={{overflowX:"auto"}}>
                <table>
                  <thead><tr>{["Campaign","Spend","Reach","Frequency","Impr.","CPM","Link Clicks","CTR (Link)","CPC (Link)","Clicks (All)","CTR (All)","CPC (All)","Leads","Cost/Lead"].map(h=><th key={h}>{h}</th>)}</tr></thead>
                  <tbody>
                    {campaigns.map((c,i)=>(
                      <tr className="row" key={i}>
                        <td style={{fontWeight:500,maxWidth:200,overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</td>
                        <td>{money(c.spend)}</td>
                        <td>{num(c.reach)}</td>
                        <td>{c.frequency.toFixed(2)}</td>
                        <td>{num(c.impressions)}</td>
                        <td>{money(c.cpm)}</td>
                        <td>{num(c.linkClicks)}</td>
                        <td>{c.ctrLink.toFixed(2)}%</td>
                        <td>{money(c.cpcLink)}</td>
                        <td>{num(c.clicks)}</td>
                        <td>{c.ctrAll.toFixed(2)}%</td>
                        <td>{money(c.cpcAll)}</td>
                        <td>{num(c.results)}</td>
                        <td>{c.cpl ? money(c.cpl) : "—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {campaigns.length>0 && (
            <div className="card" style={{marginBottom:20}}>
              <div className="eyebrow">Spend by Campaign</div>
              <BarCanvas labels={campaigns.map(c=>c.name)} data={campaigns.map(c=>c.spend)} height={Math.max(180,campaigns.length*34)}/>
            </div>
          )}

          {trend.length>0 && (
            <div className="card" style={{marginBottom:20}}>
              <div className="eyebrow">Spend &amp; Leads Trend</div>
              <div style={{fontSize:11.5,color:"var(--text-faint)",marginTop:2,marginBottom:4}}>Bars = daily spend (left axis) · Line = daily leads (right axis)</div>
              <TrendCanvas labels={trend.map(t=>t.date)} spend={trend.map(t=>t.spend)} leads={trend.map(t=>t.leads)}/>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = {error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  componentDidCatch(error, info){ console.error("Dashboard crashed:", error, info); }
  render(){
    if(this.state.error){
      return (
        <div style={{padding:40,color:"#f2ece0",fontFamily:"'DM Sans',sans-serif"}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,marginBottom:10}}>Something broke on this page</div>
          <div style={{color:"#a89d85",fontSize:13.5,marginBottom:16}}>{String(this.state.error.message || this.state.error)}</div>
          <button className="btn btn-primary" onClick={()=>this.setState({error:null})}>Try again</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
